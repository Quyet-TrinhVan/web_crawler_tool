<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Crawler UI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5b6675;
      --primary: #0b66ff;
      --border: #d8e0ea;
      --danger: #c81e1e;
      --ok: #0f7a35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #e7efff 0%, var(--bg) 45%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p { margin: 0 0 18px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      font-size: 13px;
      margin: 0 0 6px;
      color: var(--muted);
    }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 102, 255, 0.15);
    }
    button {
      background: var(--primary);
      color: #fff;
      border: 0;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f9fbff;
      min-height: 44px;
      white-space: pre-wrap;
    }
    .stream-box {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f172a;
      color: #dbeafe;
      overflow: hidden;
    }
    .stream-header {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
    }
    .stream-log {
      margin: 0;
      padding: 12px;
      min-height: 180px;
      max-height: 360px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.55;
    }
    .login-box {
      margin: 0 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f9fbff;
      padding: 12px;
    }
    .login-actions {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
      margin-top: 10px;
    }
    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .ok { color: var(--ok); }
    .err { color: var(--danger); }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .login-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Web Crawler UI</h1>
    <p>Nhap tham so va bam Chay crawl de thay cho lenh CLI.</p>

    <div class="login-box">
      <strong>Batdongsan login session</strong>
      <p id="login-hint" style="margin-top: 8px;">Neu chua login profile Batdongsan, mo Chrome login truoc khi crawl.</p>
      <div class="login-actions">
        <button id="login-start-btn" class="btn-secondary" type="button">Mo Chrome de login</button>
        <button id="login-complete-btn" class="btn-secondary" type="button">Da login xong</button>
      </div>
    </div>

    <form id="crawl-form" class="grid">
      <div>
        <label for="source">Source</label>
        <select id="source" name="source" required>
          <option value="batdongsan.com">batdongsan.com</option>
          <option value="nhatot.com">nhatot.com</option>
        </select>
      </div>

      <div>
        <label for="mode">Mode</label>
        <select id="mode" name="mode">
          <option value="page">Theo page</option>
          <option value="today">Today (chi batdongsan)</option>
        </select>
      </div>

      <div class="full" id="page-url-wrap">
        <label for="page_url">Page URL</label>
        <input id="page_url" name="page_url" placeholder="https://..." />
      </div>

      <div id="page-number-wrap">
        <label for="page_number">Page number</label>
        <input id="page_number" name="page_number" type="number" min="1" value="1" />
      </div>

      <div>
        <label for="output">Output CSV</label>
        <input id="output" name="output" value="output.csv" required />
      </div>

      <div class="full">
        <button id="submit-btn" type="submit">Chay crawl</button>
      </div>
    </form>

    <div class="stream-box">
      <div class="stream-header">Streaming crawl log</div>
      <pre id="stream-log" class="stream-log">Chua co log.</pre>
    </div>

    <div id="result" class="result">San sang.</div>
  </div>

  <script>
    const form = document.getElementById("crawl-form");
    const source = document.getElementById("source");
    const mode = document.getElementById("mode");
    const pageUrlWrap = document.getElementById("page-url-wrap");
    const pageNumberWrap = document.getElementById("page-number-wrap");
    const pageUrl = document.getElementById("page_url");
    const pageNumber = document.getElementById("page_number");
    const output = document.getElementById("output");
    const submitBtn = document.getElementById("submit-btn");
    const result = document.getElementById("result");
    const streamLog = document.getElementById("stream-log");
    const loginStartBtn = document.getElementById("login-start-btn");
    const loginCompleteBtn = document.getElementById("login-complete-btn");
    const loginHint = document.getElementById("login-hint");
    let activeEventSource = null;

    function setResult(message, ok) {
      result.textContent = message;
      result.classList.remove("ok", "err");
      result.classList.add(ok ? "ok" : "err");
    }

    function setStreamLog(message) {
      streamLog.textContent = message;
      streamLog.scrollTop = streamLog.scrollHeight;
    }

    function appendStreamLog(message) {
      if (streamLog.textContent === "Chua co log.") {
        streamLog.textContent = "";
      }
      streamLog.textContent += (streamLog.textContent ? "\n" : "") + message;
      streamLog.scrollTop = streamLog.scrollHeight;
    }

    function refreshModeUi() {
      const isToday = mode.value === "today";
      pageUrlWrap.style.display = isToday ? "none" : "block";
      pageNumberWrap.style.display = isToday ? "none" : "block";

      if (isToday && source.value !== "batdongsan.com") {
        source.value = "batdongsan.com";
      }

      const isBatdongsan = source.value === "batdongsan.com";
      loginStartBtn.disabled = !isBatdongsan;
      loginCompleteBtn.disabled = !isBatdongsan;
      loginHint.textContent = isBatdongsan
        ? "Neu chua login profile Batdongsan, mo Chrome login truoc khi crawl."
        : "Login session nay chi ap dung cho batdongsan.com.";
    }

    mode.addEventListener("change", refreshModeUi);
    source.addEventListener("change", refreshModeUi);
    refreshModeUi();

    async function startCrawlStream(payload) {
      if (activeEventSource) {
        activeEventSource.close();
        activeEventSource = null;
      }

      const response = await fetch("/api/crawl/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || "Loi khong xac dinh");
      }

      setStreamLog("Da khoi tao job crawl...\nDang nhan log streaming.");

      activeEventSource = new EventSource(`/api/crawl/events/${data.job_id}`);

      activeEventSource.addEventListener("log", (event) => {
        appendStreamLog(event.data);
      });

      activeEventSource.addEventListener("done", (event) => {
        try {
          const resultData = JSON.parse(event.data);
          setResult(
            `Thanh cong\nSource: ${resultData.source}\nSo tin: ${resultData.count}\nCSV: ${resultData.output}`,
            true,
          );
          appendStreamLog("[done] Crawl hoan tat.");
        } catch (error) {
          setResult(`Thanh cong nhung khong doc duoc ket qua: ${error.message}`, false);
        }
        activeEventSource.close();
        activeEventSource = null;
      });

      activeEventSource.addEventListener("error", (event) => {
        if (activeEventSource) {
          activeEventSource.close();
          activeEventSource = null;
        }
        if (event && event.data) {
          setResult(`That bai: ${event.data}`, false);
          appendStreamLog(`[error] ${event.data}`);
        } else {
          setResult("That bai: Mat ket noi streaming.", false);
          appendStreamLog("[error] Mat ket noi streaming.");
        }
      });
    }

    async function callLoginApi(path, loadingText) {
      loginStartBtn.disabled = true;
      loginCompleteBtn.disabled = true;
      setResult(loadingText, true);

      try {
        const response = await fetch(path, { method: "POST" });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Loi khong xac dinh");
        }
        setResult(`${data.message}\nProfile: ${data.profile}`, true);
      } catch (error) {
        setResult(`That bai: ${error.message}`, false);
      } finally {
        refreshModeUi();
      }
    }

    loginStartBtn.addEventListener("click", async () => {
      await callLoginApi("/api/login/batdongsan/start", "Dang mo Chrome login...");
    });

    loginCompleteBtn.addEventListener("click", async () => {
      await callLoginApi("/api/login/batdongsan/complete", "Dang dong Chrome va luu session...");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      setResult("Dang chay crawl, vui long doi...", true);
      setStreamLog("Dang chuan bi crawl...");

      const payload = {
        source: source.value,
        output: output.value.trim(),
      };

      if (mode.value === "today") {
        payload.date = "today";
      } else {
        payload.page_url = pageUrl.value.trim();
        payload.page_number = Number(pageNumber.value || 1);
      }

      try {
        await startCrawlStream(payload);
      } catch (error) {
        setResult(`That bai: ${error.message}`, false);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
