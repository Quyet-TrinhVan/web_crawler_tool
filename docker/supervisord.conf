[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x1080x24 -ac +extension RANDR
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/bin/sh -lc "sleep 1 && exec /usr/bin/fluxbox"
priority=20
autostart=true
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/sh -lc "sleep 2 && exec /usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/bin/sh -lc "sleep 3 && exec /usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900"
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
directory=/app
command=/usr/local/bin/uvicorn web_ui:app --host 0.0.0.0 --port 8000
priority=50
autostart=true
autorestart=true
environment=DISPLAY=":99",PYTHONUNBUFFERED="1",CHROME_BINARY="/usr/bin/chromium",CHROMEDRIVER_PATH="/usr/bin/chromedriver"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
